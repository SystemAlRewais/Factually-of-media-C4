<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الإدارة - اختيار الفرقة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 450px; text-align: right;">
        <div class="admin-badge">جامعة الأزهر - كلية الإعلام</div>
        <h2 style="font-size: 1.3rem;">لوحة التحكم والإدارة</h2>
        <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px;">اختر الفرقة الدراسية للتحكم في محتواها وإعداداتها وسجلاتها وسكانها.</p>

        <button class="btn" onclick="selectGrade('الفرقة الأولى')" style="margin-bottom: 12px;">إدارة الفرقة الأولى</button>
        <button class="btn" onclick="selectGrade('الفرقة الثانية')" style="margin-bottom: 12px;">إدارة الفرقة الثانية</button>
        <button class="btn" onclick="selectGrade('الفرقة الثالثة')" style="margin-bottom: 12px;">إدارة الفرقة الثالثة</button>
        <button class="btn" onclick="selectGrade('الفرقة الرابعة')" style="margin-bottom: 15px;">إدارة الفرقة الرابعة</button>

        <button class="btn btn-secondary" onclick="window.location.href='index.html'">العودة لتسجيل الدخول</button>
    </div>

    <script>
        function selectGrade(grade) {
            localStorage.setItem('adminGrade', grade);
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
