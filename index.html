<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كلية الإعلام - جامعة الأزهر | تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="admin-badge">جامعة الأزهر - كلية الإعلام</div>
        <h2>تسجيل الدخول للنظام الأكاديمي</h2>
        <p>يرجى إدخال بيانات حسابك الجامعي المعتمد</p>

        <div class="input-group">
            <label>الرقم الجامعي / اسم المستخدم:</label>
            <input type="text" id="loginId" placeholder="أدخل الكود الخاص بك">
        </div>
        <div class="input-group">
            <label>كلمة السر:</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button type="button" class="btn" onclick="systemLogin()">دخول المنصة</button>

        <p id="authStatus" class="status-msg"></p>

        <div style="margin-top: 15px; text-align: center;">
            <a href="admin-select.html" style="font-size: 13px; color: #38bdf8; text-decoration: none; font-weight: bold;">🔐 بوابة الإدارة العليا وخيار إنشاء الحسابات</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        async function systemLogin() {
            const id = document.getElementById('loginId').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            const statusEl = document.getElementById('authStatus');

            if (!id || !pass) { alert("يرجى إدخال البيانات!"); return; }

            statusEl.style.color = "#38bdf8";
            statusEl.textContent = "⏳ جاري التحقق سحابياً...";

            try {
                const res = await fetch(`${googleScriptUrl}?action=loginStudent&id=${encodeURIComponent(id)}&pass=${encodeURIComponent(pass)}`);
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('currentUser', JSON.stringify(data.student));
                    window.location.href = "student.html";
                } else {
                    statusEl.style.color = "var(--accent-red)";
                    statusEl.textContent = "❌ بيانات الدخول غير صحيحة!";
                }
            } catch (e) {
                statusEl.style.color = "var(--accent-red)";
                statusEl.textContent = "❌ خطأ في الاتصال بالسحابة.";
            }
        }
    </script>
</body>
</html>
