<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور الجغرافي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 480px; text-align: right;">
        <div class="admin-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);">📍 الحضور الذكي بالـ GPS</div>
        <h2 style="font-size: 1.4rem;">تسجيل المحاضرة الحالية</h2>
        
        <p id="subDisplay" style="color: #38bdf8; font-weight: bold; margin-bottom: 15px;">جاري جلب بيانات المحاضرة...</p>

        <div id="attForm" style="display:none;">
            <p id="statusMsg" style="font-size: 0.9rem; margin-bottom: 15px;"></p>
            <button class="btn" onclick="verifyAndRecordGPS()" style="background: #10b981; padding: 15px;">📍 تحقق من موقعي وسجل حضوري</button>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='student.html'" style="margin-top: 15px;">العودة للوحة الطالب</button>
    </div>

    <script src="script.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if(!user) { window.location.href = 'index.html'; }

        let lectureData = null;

        async function checkLectureStatus() {
            try {
                const res = await fetch(`${googleScriptUrl}?action=getGradeData&grade=${user.grade}`);
                const data = await res.json();
                lectureData = data.lecture;

                document.getElementById('subDisplay').textContent = `المحاضرة المفعلة: ${lectureData.subject}`;

                if (String(lectureData.isOpen) === "true") {
                    document.getElementById('attForm').style.display = 'block';
                    document.getElementById('statusMsg').textContent = "التسجيل مفتوح حالياً. اضغط على زر التحقق أدناه لتسجيل حضورك ضمن النطاق المسموح.";
                    document.getElementById('statusMsg').style.color = "var(--accent-green)";
                } else {
                    document.getElementById('attForm').style.display = 'none';
                    document.getElementById('statusMsg').textContent = "🔒 تسجيل الحضور مغلق حالياً من قِبل الإدارة.";
                }
            } catch(e) {
                document.getElementById('subDisplay').textContent = "تعذر الاتصال بالسحابة.";
            }
        }
        checkLectureStatus();

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const φ1 = lat1 * Math.PI/180, φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180, Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        function verifyAndRecordGPS() {
            let msg = document.getElementById('statusMsg');
            msg.textContent = "⏳ جاري تحديد موقعك الجغرافي...";

            if (!navigator.geolocation) { alert("متصفحك لا يدعم الـ GPS"); return; }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                let lat = pos.coords.latitude;
                let lng = pos.coords.longitude;
                let link = `https://maps.google.com/?q=${lat},${lng}`;

                let dist = calculateDistance(lat, lng, Number(lectureData.lat), Number(lectureData.lng));

                if (dist > Number(lectureData.range)) {
                    msg.style.color = "var(--accent-red)";
                    msg.textContent = `❌ أنت خارج نطاق المحاضرة المسموح (تبعد ${Math.round(dist)} متر).`;
                    return;
                }

                msg.textContent = "⏳ جاري إرسال الحضور للسحابة...";
                await fetch(googleScriptUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: "recordAttendance",
                        grade: user.grade,
                        id: user.id,
                        name: user.name,
                        subject: lectureData.subject,
                        locationLink: link
                    })
                });

                msg.style.color = "var(--accent-green)";
                msg.textContent = "✅ تم تسجيل حضورك بنجاح وسجل في الأرشيف الحي!";
                alert("🎉 تم تسجيل حضورك للمحاضرة بنجاح!");
                setTimeout(() => window.location.href = 'student.html', 1500);

            }, () => {
                msg.style.color = "var(--accent-red)";
                msg.textContent = "❌ فشل في قراءة الموقع. تأكد من تفعيل الـ GPS.";
            });
        }
    </script>
</body>
</html>
