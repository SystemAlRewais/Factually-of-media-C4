<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفرقة الأكاديمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width: 900px; text-align: right;">
        <div class="admin-badge" style="background: rgba(239, 68, 68, 0.1); color: var(--accent-red);">🔐 لوحة الإدارة المركزية</div>
        <h2 id="adminTitleHeader">إدارة الفرقة: ...</h2>
        <p style="color: var(--text-sub);">كل ما ترفعه هنا يخص هذه الفرقة وحدها ولن يراه طلاب الفرص الأخرى.</p>

        <!-- 1. رفع الكتب -->
        <div class="card">
            <h3 style="color: #f59e0b;">📚 رفع كتاب أو مرجع (PDF / Drive)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="bookTitle" placeholder="اسم الكتاب">
                <input type="text" id="bookLink" placeholder="رابط التحميل">
            </div>
            <button class="btn" onclick="uploadItem('book')" style="background: #f59e0b;">رفع الكتاب للفرقة</button>
        </div>

        <!-- 2. رفع جداول المحاضرات -->
        <div class="card">
            <h3 style="color: #38bdf8;">📅 رفع جدول المحاضرات</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="schTitle" placeholder="عنوان الجدول">
                <input type="text" id="schLink" placeholder="رابط الجدول">
            </div>
            <button class="btn" onclick="uploadItem('schedule')" style="background: #38bdf8;">رفع جدول المحاضرات</button>
        </div>

        <!-- 3. رفع جداول الاختبارات -->
        <div class="card">
            <h3 style="color: #10b981;">📝 رفع جدول الاختبارات</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="examTitle" placeholder="عنوان جدول الامتحانات">
                <input type="text" id="examLink" placeholder="رابط الجدول">
            </div>
            <button class="btn" onclick="uploadItem('exam')" style="background: #10b981;">رفع جدول الامتحانات</button>
        </div>

        <!-- 4. إرسال إعلان للدفعة -->
        <div class="card">
            <h3 style="color: #a855f7;">📢 إرسال إعلان أو تنبيه أو لينك جروب</h3>
            <textarea id="adminAnnouncement" placeholder="اكتب الرسالة هنا..." rows="3" style="width:100%; padding:10px; background:#030712; color:#fff; border-radius:8px; border:1px solid var(--border-color); margin-bottom:10px;"></textarea>
            <button class="btn" onclick="sendAnnouncement()" style="background: #a855f7;">نشر الإعلان للدفعة</button>
        </div>

        <!-- 5. الشكاوى الواردة -->
        <div class="card">
            <h3 style="color: var(--accent-red);">✉️ الشكاوى الواردة من طلاب هذه الفرقة</h3>
            <div id="complaintsContainer" style="max-height: 200px; overflow-y: auto;">
                <p style="color: var(--text-sub);">جاري جلب الشكاوى...</p>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="window.location.href='admin-select.html'" style="margin-top: 15px;">⬅️ العودة لاختيار فرقة أخرى</button>
    </div>

    <script src="script.js"></script>
    <script>
        const currentGrade = localStorage.getItem('adminSelectedGrade') || "الفرقة الأولى";
        document.getElementById('adminTitleHeader').textContent = `إدارة الفرقة: ${currentGrade}`;

        async function uploadItem(type) {
            let titleId = type === 'book' ? 'bookTitle' : (type === 'schedule' ? 'schTitle' : 'examTitle');
            let linkId = type === 'book' ? 'bookLink' : (type === 'schedule' ? 'schLink' : 'examLink');
            
            let title = document.getElementById(titleId).value.trim();
            let link = document.getElementById(linkId).value.trim();

            if(!title || !link) { alert("أكمل البيانات"); return; }

            alert("جاري الرفع للسحابة...");
            await fetch(googleScriptUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "addGradeContent", grade: currentGrade, type: type, title: title, link: link })
            }).catch(()=>{});
            
            alert("✅ تم الرفع بنجاح!");
            document.getElementById(titleId).value = '';
            document.getElementById(linkId).value = '';
        }

        async function sendAnnouncement() {
            let msg = document.getElementById('adminAnnouncement').value.trim();
            if(!msg) return;
            alert("جاري النشر...");
            await fetch(googleScriptUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "sendAnnouncement", grade: currentGrade, message: msg })
            }).catch(()=>{});
            alert("📢 تم نشر الإعلان للدفعة بنجاح!");
            document.getElementById('adminAnnouncement').value = '';
        }

        async function loadComplaints() {
            try {
                const res = await fetch(`${googleScriptUrl}?action=getComplaints&grade=${currentGrade}`);
                const data = await res.json();
                const container = document.getElementById('complaintsContainer');
                if(data.length === 0) { container.innerHTML = "<p style='color:var(--text-sub);'>لا توجد شكاوى مسجلة.</p>"; return; }
                container.innerHTML = data.map(c => `<div style="padding:10px; background:rgba(255,255,255,0.03); border-radius:8px; margin-bottom:8px;"><span style="color:#38bdf8; font-weight:bold;">${c.name} (${c.id}):</span><p style="margin:5px 0; font-size:0.9rem;">${c.text}</p></div>`).join('');
            } catch(e) {}
        }
        loadComplaints();
    </script>
</body>
</html>
