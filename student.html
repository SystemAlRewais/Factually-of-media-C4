<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب | المنصة التعليمية</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .grid-dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .forum-box { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .msg { font-size: 13px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .msg span { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <div class="admin-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-green);">👨‍🎓 بوابة الطالب الأكاديمية</div>
        
        <!-- البطاقة الشخصية -->
        <div class="card" style="display: flex; justify-content: space-between; align-items: center; background: rgba(99, 102, 241, 0.1);">
            <div>
                <h3 id="studentNameDisplay" style="margin-bottom: 5px;">أهلاً بك، ...</h3>
                <p id="studentInfoDisplay" style="margin: 0; font-size: 13px; color: var(--text-main);"></p>
            </div>
            <button class="btn" style="width: auto; padding: 10px 20px;" onclick="window.location.href='subjects.html'">📍 تسجيل الحضور (GPS)</button>
        </div>

        <div class="grid-dashboard">
            <!-- قسم المقررات والكتب -->
            <div class="card">
                <h3>📚 المقررات والكتب الدراسية</h3>
                <div id="booksContainer">
                    <p style="font-size: 13px;">جاري التحميل...</p>
                </div>
            </div>

            <!-- قسم الجداول والدرجات -->
            <div class="card">
                <h3>📅 الجداول والدرجات</h3>
                <div id="schedulesContainer">
                    <p style="font-size: 13px;">جاري التحميل...</p>
                </div>
            </div>

            <!-- منتدى النقاش -->
            <div class="card">
                <h3>💬 منتدى نقاش الدفعة</h3>
                <div class="forum-box" id="chatBox">
                    <p style="font-size: 12px; color: #888;">جاري تحميل الرسائل...</p>
                </div>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="chatMessage" placeholder="اكتب استفسارك هنا..." style="flex: 3; padding: 8px;">
                    <button class="btn" onclick="sendChatMessage()" style="flex: 1; margin-top: 0;">إرسال</button>
                </div>
            </div>

            <!-- الشكاوى -->
            <div class="card">
                <h3>✉️ صندوق الشكاوى والمقترحات</h3>
                <textarea id="complaintText" placeholder="اكتب رسالتك للإدارة (تصل بسرية تامة)..." rows="3" style="width: 100%; padding: 10px; background: #030712; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; margin-bottom: 10px; resize: none;"></textarea>
                <button class="btn" onclick="submitComplaint()" style="background: var(--accent-red);">إرسال الشكوى</button>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="logout()" style="margin-top: 20px;">🚪 تسجيل الخروج</button>
    </div>

    <script src="script.js"></script>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('studentNameDisplay').textContent = `أهلاً بك، ${currentUser.name}`;
            document.getElementById('studentInfoDisplay').textContent = `الرقم الجامعي: ${currentUser.id} | الفرقة: ${currentUser.grade}`;
            loadStudentDashboard();
        }

        async function loadStudentDashboard() {
            try {
                // جلب المحتوى من السحابة بناءً على فرقة الطالب
                const res = await fetch(`${googleScriptUrl}?action=getDashboardData&grade=${currentUser.grade}`);
                const data = await res.json();
                
                // عرض الكتب
                const booksHtml = data.books.map(b => `<a href="${b.link}" target="_blank" style="display:block; color:#10b981; margin-bottom:5px; text-decoration:none;">📄 ${b.title}</a>`).join('') || "لا توجد كتب متاحة حالياً.";
                document.getElementById('booksContainer').innerHTML = booksHtml;

                // عرض الجداول
                const schedulesHtml = data.schedules.map(s => `<a href="${s.link}" target="_blank" style="display:block; color:#38bdf8; margin-bottom:5px; text-decoration:none;">🗓️ ${s.title}</a>`).join('') || "لا توجد جداول متاحة حالياً.";
                document.getElementById('schedulesContainer').innerHTML = schedulesHtml;

                // عرض الشات
                const chatHtml = data.chat.map(c => `<div class="msg"><span>${c.name}:</span> ${c.message}</div>`).join('') || "لا توجد رسائل سابقة.";
                document.getElementById('chatBox').innerHTML = chatHtml;
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

            } catch (e) {
                console.error("Error loading dashboard", e);
            }
        }

        async function sendChatMessage() {
            const msg = document.getElementById('chatMessage').value.trim();
            if(!msg) return;
            
            document.getElementById('chatMessage').value = '';
            document.getElementById('chatBox').innerHTML += `<div class="msg"><span>${currentUser.name}:</span> ${msg} (جاري الإرسال...)</div>`;
            
            await fetch(googleScriptUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "sendChat", name: currentUser.name, grade: currentUser.grade, message: msg })
            });
            loadStudentDashboard(); // تحديث الشات
        }

        async function submitComplaint() {
            const text = document.getElementById('complaintText').value.trim();
            if(!text) return;
            
            alert("تم إرسال شكواك للإدارة بنجاح.");
            document.getElementById('complaintText').value = '';
            
            await fetch(googleScriptUrl, {
                method: 'POST',
                body: JSON.stringify({ action: "sendComplaint", name: currentUser.name, id: currentUser.id, text: text })
            });
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
